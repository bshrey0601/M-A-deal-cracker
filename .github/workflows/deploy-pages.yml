# Builds the React UI and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# GitHub Pages is static hosting, so the Node API (live market data, AI thesis) must run
# elsewhere (e.g. Render). The UI calls https://m-a-deal-cracker.onrender.com by default; to use
# another server, set the repository variable API_BASE_URL
# (Settings -> Secrets and variables -> Actions -> Variables).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://m-a-deal-cracker.onrender.com' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
